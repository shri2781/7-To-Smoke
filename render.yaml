services:
  - type: web
    name: seven-to-smoke
    runtime: node
    plan: free # bump to "starter" ($7/mo) to remove the 15-min-idle cold start
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: node dist/server/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: ADMIN_PASSCODE
        sync: false
      - key: JWT_SECRET
        generateValue: true
